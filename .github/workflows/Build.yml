name: Build

on:
  push:
    branches:
    - main
    - experimental

permissions:
  contents: write

jobs:
  Build Pack:
    runs-on: windows-latest

      env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y
      
      - name: Equalize audio
        run: python Equalizer.py

      - name: Generate index
        run: python "Index Gen.py"

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if (git diff --cached --quiet) {
            Write-Host "No changes to commit."
          }
          else {
            git commit -m "Normalize audio and regenerate index"
            git push
          }